<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Robining Agent: inspectable LEGO for AI Agents</title>
  <desc id="desc">A dark engineering-style banner showing six colorful semantic LEGO blocks, a three-layer onion architecture, and evidence gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091326"/>
      <stop offset="1" stop-color="#142a4a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e3ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9d7bff" stop-opacity=".1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .ui { font-family: "DejaVu Sans", Arial, sans-serif; }
      .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; }
      .label { font-size: 21px; font-weight: 700; letter-spacing: .8px; }
      .small { font-size: 16px; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1600" height="760" rx="34" fill="url(#bg)"/>
  <path d="M0 170 C360 80 610 240 920 130 S1350 80 1600 160" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".65"/>
  <path d="M0 620 C340 530 620 690 930 570 S1350 520 1600 610" fill="none" stroke="#64d6ff" stroke-width="1" opacity=".18"/>

  <g class="ui" fill="#f7fbff">
    <text x="86" y="112" font-size="66" font-weight="800" letter-spacing="-2">Robining Agent</text>
    <text x="90" y="164" font-size="27" fill="#a9c3df">I built an AI Agent as <tspan fill="#66e3ff" font-weight="800">inspectable LEGO</tspan>.</text>
    <text x="90" y="208" class="small" fill="#7895b5">CLASSIFY  ·  ROUTE  ·  EXECUTE  ·  VERIFY</text>
  </g>

  <!-- LEGO semantic buckets -->
  <g filter="url(#shadow)" class="ui">
    <g transform="translate(92 300)">
      <rect width="410" height="82" rx="16" fill="#ff6b7a"/>
      <circle cx="42" cy="-4" r="13" fill="#ff92a0"/><circle cx="86" cy="-4" r="13" fill="#ff92a0"/>
      <text x="30" y="51" class="label" fill="#fff">core</text><text x="160" y="51" class="small" fill="#ffe9ed">rules &amp; identity</text>
    </g>
    <g transform="translate(92 394)">
      <rect width="410" height="82" rx="16" fill="#ff9f43"/>
      <circle cx="42" cy="-4" r="13" fill="#ffc27f"/><circle cx="86" cy="-4" r="13" fill="#ffc27f"/>
      <text x="30" y="51" class="label" fill="#fff">capabilities</text><text x="250" y="51" class="small" fill="#fff1df">reusable actions</text>
    </g>
    <g transform="translate(92 488)">
      <rect width="410" height="82" rx="16" fill="#ffd166"/>
      <circle cx="42" cy="-4" r="13" fill="#ffe7a5"/><circle cx="86" cy="-4" r="13" fill="#ffe7a5"/>
      <text x="30" y="51" class="label" fill="#26334a">template</text><text x="185" y="51" class="small" fill="#5c4c19">safe starting points</text>
    </g>
    <g transform="translate(92 582)">
      <rect width="194" height="82" rx="16" fill="#42d6a4"/>
      <circle cx="42" cy="-4" r="13" fill="#8ae9c8"/><circle cx="86" cy="-4" r="13" fill="#8ae9c8"/>
      <text x="30" y="51" class="label" fill="#082d2b">projects</text>
    </g>
    <g transform="translate(302 582)">
      <rect width="200" height="82" rx="16" fill="#59a7ff"/>
      <circle cx="42" cy="-4" r="13" fill="#a1ceff"/><circle cx="86" cy="-4" r="13" fill="#a1ceff"/>
      <text x="30" y="51" class="label" fill="#08244d">outputs</text>
    </g>
    <g transform="translate(92 676)">
      <rect width="410" height="42" rx="14" fill="#9d7bff"/>
      <text x="30" y="29" class="mono" font-size="15" font-weight="700" fill="#fff">local-runtime  /  private state stays local</text>
    </g>
  </g>

  <!-- connector -->
  <path d="M550 442 H665" stroke="#66e3ff" stroke-width="3" stroke-dasharray="8 10"/>
  <circle cx="665" cy="442" r="8" fill="#66e3ff"/>

  <!-- onion architecture -->
  <g class="ui" transform="translate(720 270)">
    <text x="0" y="-32" class="small" fill="#7895b5">THREE-LAYER ONION</text>
    <rect x="0" y="0" width="740" height="350" rx="32" fill="#1d4166" stroke="#4f86b8" stroke-width="2"/>
    <rect x="42" y="45" width="656" height="260" rx="26" fill="#163653" stroke="#5aa7d9" stroke-width="2"/>
    <rect x="88" y="92" width="564" height="166" rx="22" fill="#102a47" stroke="#66e3ff" stroke-width="2"/>
    <circle cx="370" cy="175" r="54" fill="#66e3ff" fill-opacity=".12" stroke="#66e3ff" stroke-width="2"/>
    <text x="370" y="169" text-anchor="middle" font-size="24" font-weight="800" fill="#effaff">WHY</text>
    <text x="370" y="198" text-anchor="middle" font-size="17" fill="#a9eaff">HOW · MIX</text>
    <text x="22" y="36" font-size="18" font-weight="700" fill="#d8ecff">HOST ADAPTER</text>
    <text x="64" y="80" font-size="18" font-weight="700" fill="#bde1ff">ROBining ORCHESTRATION</text>
    <text x="112" y="126" font-size="18" font-weight="700" fill="#8edfff">TOOL BRIDGE / BACKEND</text>
    <text x="370" y="282" text-anchor="middle" class="mono" font-size="15" fill="#91b5d6">replaceable layers · inspectable boundaries</text>
    <path d="M740 130 h52" stroke="#66e3ff" stroke-width="3" stroke-dasharray="7 9"/>
    <path d="M740 175 h52" stroke="#66e3ff" stroke-width="3" stroke-dasharray="7 9"/>
    <path d="M740 220 h52" stroke="#66e3ff" stroke-width="3" stroke-dasharray="7 9"/>
    <g transform="translate(808 92)">
      <rect width="122" height="166" rx="16" fill="#0b2038" stroke="#71e0b6"/>
      <text x="61" y="40" text-anchor="middle" class="small" fill="#71e0b6">EVIDENCE</text>
      <text x="61" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">observed</text>
      <text x="61" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">proxy</text>
      <text x="61" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">limits</text>
    </g>
  </g>

  <g class="ui" transform="translate(720 690)">
    <text x="0" y="0" class="mono" font-size="17" fill="#9bb7d1">A local-first Agent framework for developers and Agent builders.</text>
    <text x="1395" y="0" text-anchor="end" class="mono" font-size="17" fill="#66e3ff">robining-agent · open source</text>
  </g>
</svg>
